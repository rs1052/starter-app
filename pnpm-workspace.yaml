runtimeOnFail: ignore
pmOnFail: ignore
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.3.0"
  "vitest@*": "5.0.5"
peerDependencyRules:
  allowedVersions:
    # The core alias has version 1.3.0 but bundles Vite 8.3.4.
    "@void/vue@1.2.0>vite": "1.3.0"
    "void@1.2.0>vite": "1.3.0"
    "@vitejs/plugin-vue@6.0.10>vite": "1.3.0"
    "@cloudflare/vite-plugin@1.64.0>vite": "1.3.0"
    "vitest@5.0.5>vite": "1.3.0"
    "@vitest/mocker@5.0.5>vite": "1.3.0"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "void@1.2.0"
  - "@void/vue@1.2.0"
  - "@void/deploy-cloudflare@1.2.0"
  - "@void/deploy-core@1.2.0"
  - "@void/edge@1.2.0"
  - "@void/isr@1.2.0"
  - "@void/platform@1.2.0"
  - "postal-mime@4.1.3"
